{{- include "tss.validate" . }}
{{- $name := include "tss.name" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.serviceAccount.name }}
{{- if not .Values.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ $name }}
type: Opaque
stringData:
  API_KEYS: {{ required "apiKeys is required" (join "," .Values.apiKeys) | quote }}
  {{- if .Values.ui.enabled }}
  UI_OIDC_CLIENT_SECRET: {{ .Values.ui.oidc.clientSecret | quote }}
  UI_SESSION_SECRET: {{ .Values.ui.sessionSecret | quote }}
  {{- end }}
  {{- with .Values.database }}
  {{- $url := printf "postgresql://%s:%s@%s:%v/%s?sslmode=%s" .user (required "database.password is required" .password) (required "database.host is required" .host) .port .name .sslmode }}
  {{- if hasPrefix "verify-" .sslmode }}
  {{- $url = printf "%s&sslrootcert=%s" $url (ternary "/etc/terrakube-selfservice-db/ca.crt" "system" (ne .caSecret.name "")) }}
  {{- end }}
  DATABASE_URL: {{ $url | quote }}
  {{- end }}
  {{- with .Values.token.value }}
  TERRAKUBE_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.existingCatalogConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "tss.catalogConfigMap" . }}
data:
  catalog.yaml: |
    {{- toYaml .Values.catalog | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: terrakube-selfservice
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if include "tss.openbaoAddr" . }}
  annotations:
    checkov.io/skip1: CKV_K8S_38=Service account token is needed for OpenBao Kubernetes auth
  {{- end }}
spec:
  # The reconciler is guarded by a PostgreSQL advisory lock; one replica is
  # enough for most installations.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terrakube-selfservice
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terrakube-selfservice
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Restart on catalog or credential changes.
        checksum/config: {{ printf "%s|%s|%s|%s|%s" (toJson .Values.catalog) (toJson .Values.apiKeys) (toJson .Values.database) .Values.token.value (toJson .Values.ui) | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # The token is only needed for OpenBao Kubernetes auth.
      automountServiceAccountToken: {{ ne (include "tss.openbaoAddr" .) "" }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ include "tss.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "tss.secretName" . }}
          env:
            - name: CATALOG_PATH
              value: /etc/terrakube-selfservice/catalog.yaml
            - name: TERRAKUBE_API_URL
              value: {{ .Values.terrakube.apiUrl | quote }}
            - name: TERRAKUBE_UI_URL
              value: {{ .Values.terrakube.uiUrl | quote }}
            - name: TERRAKUBE_ORGANIZATION
              value: {{ .Values.terrakube.organization | quote }}
            - name: TERRAKUBE_VCS_ID
              value: {{ .Values.terrakube.vcsId | quote }}
            - name: TERRAKUBE_APPLY_TEMPLATE
              value: {{ .Values.terrakube.applyTemplate | quote }}
            - name: TERRAKUBE_DESTROY_TEMPLATE
              value: {{ .Values.terrakube.destroyTemplate | quote }}
            - name: TERRAKUBE_PROJECT
              value: {{ .Values.terrakube.project | quote }}
            - name: TERRAKUBE_TAGS
              value: {{ .Values.terrakube.tags | quote }}
            {{- if .Values.token.existingSecret.name }}
            - name: TERRAKUBE_TOKEN_FILE
              value: /var/run/terrakube-selfservice/token
            {{- end }}
            {{- with include "tss.openbaoAddr" . }}
            - name: OPENBAO_ADDR
              value: {{ . | quote }}
            - name: OPENBAO_ROLE
              value: {{ include "tss.openbaoRole" $ | quote }}
            - name: OPENBAO_SECRET_PATH
              value: {{ $.Values.token.openbao.secretPath | quote }}
            - name: OPENBAO_SECRET_KEY
              value: {{ $.Values.token.openbao.secretKey | quote }}
            {{- end }}
            - name: ACCESS_SECRET_PATH
              value: {{ .Values.access.secretPath | quote }}
            - name: ADMIN_EMAILS
              value: {{ join "," .Values.users.adminEmails | quote }}
            - name: AUDITOR_EMAILS
              value: {{ join "," .Values.users.auditorEmails | quote }}
            - name: REQUIRE_VERIFIED_EMAIL
              value: {{ .Values.users.requireVerifiedEmail | quote }}
            {{- with .Values.users.token }}
            {{- if .issuer }}
            - name: USER_TOKEN_ISSUER
              value: {{ .issuer | quote }}
            - name: USER_TOKEN_AUDIENCE
              value: {{ .audience | quote }}
            - name: USER_TOKEN_JWKS_URL
              value: {{ .jwksUrl | quote }}
            - name: USER_TOKEN_EMAIL_CLAIM
              value: {{ .emailClaim | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.ui.enabled }}
            - name: UI_ENABLED
              value: "true"
            - name: UI_PUBLIC_URL
              value: {{ required "ui.publicUrl is required when ui.enabled" .Values.ui.publicUrl | quote }}
            - name: UI_TITLE
              value: {{ .Values.ui.title | quote }}
            - name: UI_OIDC_ISSUER
              value: {{ .Values.ui.oidc.issuer | quote }}
            - name: UI_OIDC_CLIENT_ID
              value: {{ .Values.ui.oidc.clientId | quote }}
            - name: UI_OIDC_SCOPES
              value: {{ .Values.ui.oidc.scopes | quote }}
            - name: UI_SESSION_MAX_AGE_HOURS
              value: {{ .Values.ui.sessionMaxAgeHours | quote }}
            {{- end }}
            {{- if .Values.tls.secretName }}
            - name: UVICORN_SSL_CERTFILE
              value: /etc/terrakube-selfservice-tls/tls.crt
            - name: UVICORN_SSL_KEYFILE
              value: /etc/terrakube-selfservice-tls/tls.key
            {{- end }}
            - name: ALLOW_INSECURE_TRANSPORT
              value: {{ .Values.allowInsecureTransport | quote }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.reconcileIntervalSeconds | quote }}
            - name: DELETE_WORKSPACE_AFTER_DESTROY
              value: {{ .Values.deleteWorkspaceAfterDestroy | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" (ne .Values.tls.secretName "") }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" (ne .Values.tls.secretName "") }}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: catalog
              mountPath: /etc/terrakube-selfservice
              readOnly: true
            {{- if .Values.token.existingSecret.name }}
            - name: token
              mountPath: /var/run/terrakube-selfservice
              readOnly: true
            {{- end }}
            {{- if .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/terrakube-selfservice-tls
              readOnly: true
            {{- end }}
            {{- if .Values.database.caSecret.name }}
            - name: db-ca
              mountPath: /etc/terrakube-selfservice-db
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog
          configMap:
            name: {{ include "tss.catalogConfigMap" . }}
        {{- with .Values.token.existingSecret }}
        {{- if .name }}
        - name: token
          secret:
            secretName: {{ .name }}
            items:
              - key: {{ .key }}
                path: token
        {{- end }}
        {{- end }}
        {{- with .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.database.caSecret }}
        {{- if .name }}
        - name: db-ca
          secret:
            secretName: {{ .name }}
            items:
              - key: {{ .key }}
                path: ca.crt
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: terrakube-selfservice
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if .Values.tls.secretName }}
      appProtocol: https
      {{- end }}
{{- if .Values.route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ $name }}
spec:
  parentRefs:
    {{- required "route.parentRefs is required" .Values.route.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .Values.route.rewritePrefix }}
      backendRefs:
        - name: {{ $name }}
          port: 8080
{{- end }}
{{- with .Values.networkPolicy }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ $.Release.Namespace }}
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: terrakube-selfservice
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes: [Ingress{{ if .egress }}, Egress{{ end }}]
  ingress:
    - from:
        {{- required "networkPolicy.ingressFrom is required when networkPolicy.enabled" .ingressFrom | toYaml | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
  {{- with .egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
