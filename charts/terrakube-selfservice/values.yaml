image:
  repository: ghcr.io/3sky/terrakube-selfservice
  # Defaults to the chart's appVersion.
  tag: ""
  # sha256:... pins the exact (cosign-signed) image and overrides tag; see the
  # README for verifying a release's signature and digest.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# --- Catalog: the templates this deployment offers --------------------------
# Structured catalog, validated against catalog.schema.json at install time.
# See examples/catalog.yaml in the repository.
catalog:
  templates: []
# Or use an existing ConfigMap with a catalog.yaml key (catalog is then ignored).
existingCatalogConfigMap: ""

# --- API keys and database -----------------------------------------------------
# Bearer keys accepted from calling portals (several allow rotation).
apiKeys: []
database:
  host: ""
  port: 5432
  name: terrakube_selfservice
  user: terrakube_selfservice
  password: ""
  # verify-full checks the server certificate and host name. Weaker modes
  # (require, prefer, ...) need allowInsecureTransport.
  sslmode: verify-full
  # CA for verify-ca/verify-full: a Secret holding the server's CA certificate,
  # or the PEM itself in caCert (put in a ConfigMap), or "system" trust (public
  # CAs) when neither is given.
  caSecret:
    name: ""
    key: ca.crt
  caCert: ""
# Or an existing Secret with API_KEYS (comma-separated) and DATABASE_URL keys;
# apiKeys and database are then ignored.
existingSecret: ""

# --- Terrakube -----------------------------------------------------------------
terrakube:
  # Terrakube API base URL. Required; https:// (the token is sent with every call).
  apiUrl: ""
  # Public UI URL, used for workspace links. Required.
  uiUrl: ""
  # Organization that owns the lab workspaces. Required.
  organization: ""
  # VCS connection for private template repositories (optional): its id, or
  # its name as shown in Terrakube (Settings > VCS Providers). The id wins.
  vcsId: ""
  vcsName: ""
  applyTemplate: Plan and apply
  destroyTemplate: Destroy
  # Project for lab workspaces, created if missing; "" = no project.
  project: Self-service
  # Tag workspaces with lab_owner:<email> and expires_at:<UTC time> (moved on
  # extend, removed after destroy) so admins can filter labs in the Terrakube UI.
  tags: true

# --- OpenBao / Vault ------------------------------------------------------
# Kubernetes auth with serviceAccount.name. Used for the access endpoint and,
# unless token.existingSecret or token.value is set, for the Terrakube token.
openbao:
  # https:// (the service account token and OpenBao token are sent to it).
  addr: ""
  role: terrakube-selfservice

# Terrakube personal access token, one of:
token:
  # 1. An existing Secret, mounted as a file and re-read after a 401.
  existingSecret:
    name: ""
    key: token
  # 2. OpenBao kv-v2 (openbao.addr above). addr/role here are accepted as
  #    aliases of openbao.addr/openbao.role for 0.1.x values files.
  openbao:
    addr: ""
    role: ""
    secretPath: secret/data/terrakube-selfservice
    secretKey: terrakube_token
  # 3. A literal value, stored in the chart's Secret (development only).
  value: ""

# --- Users ------------------------------------------------------------------
users:
  # Roles (cumulative): everyone who signs in is a user (own labs only).
  # Auditors also see every lab, its history and cost, and the reports.
  # Admins also act on any lab and read its access details.
  adminEmails: []
  auditorEmails: []
  # Roles follow the email address, so OIDC identities (token mode and the
  # portal) need email_verified: true. Set false only for a provider that
  # issues verified addresses without that claim.
  requireVerifiedEmail: true
  # Token mode: identify users by their OIDC ID token (X-User-Token) instead of
  # the X-Actor-Email header set by the portal backend. Recommended.
  token:
    issuer: ""
    # Client id the ID tokens are issued to. Required with issuer.
    audience: ""
    # Defaults to the issuer's discovery document.
    jwksUrl: ""
    emailClaim: email

# --- Access details ---------------------------------------------------------
access:
  # kv-v2 path where templates publish each lab's access details; {name} is the lab name.
  secretPath: secret/data/labs/{name}

# Development only: allow http:// for Terrakube, OpenBao and OIDC issuers and
# database sslmode weaker than verify-ca. Credentials then travel unprotected.
allowInsecureTransport: false

# Hosts that may be reached over plain http:// (Terrakube, OpenBao, OIDC),
# for in-cluster services without TLS, e.g.
#   [terrakube-api-service.terrakube.svc.cluster.local, openbao.terrakube.svc.cluster.local]
# Keep the traffic inside the cluster and restrict it with NetworkPolicies.
# Database TLS is not affected.
insecureHttpHosts: []

# Extra CA certificates (PEM) trusted for HTTPS to Terrakube, OpenBao and the
# OIDC provider, besides the public CAs: inline, or a key of an existing ConfigMap.
caBundle:
  pem: ""
  configMap:
    name: ""
    key: ca.crt

reconcileIntervalSeconds: 30
deleteWorkspaceAfterDestroy: true

serviceAccount:
  # Bind this name in your OpenBao/Vault Kubernetes auth role.
  name: terrakube-selfservice

# --- Web portal ---------------------------------------------------------------
# Built-in UI at /ui: catalog, form with cost estimate, labs, access details,
# admin views. Users sign in with OIDC (for example Dex); /v1 is unchanged.
ui:
  enabled: false
  # Address users open, e.g. https://lab.example.com/portal (route.* can map
  # that prefix to /ui). Used for links, the cookie path and the OIDC callback
  # <publicUrl>/auth/callback.
  publicUrl: ""
  title: Lab self-service
  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    scopes: openid email profile
  # At least 32 random characters; signs the session cookie.
  sessionSecret: ""
  sessionMaxAgeHours: 8

# Serve HTTPS on port 8080 with a kubernetes.io/tls Secret (for example from
# cert-manager). Requests carry the API key and user tokens, so encrypt the hop
# from the portal backend or gateway to the pod. With route.enabled, the
# gateway needs a BackendTLSPolicy for this service.
tls:
  secretName: ""

# Optional Gateway API route. pathPrefix is replaced by rewritePrefix before
# the service: "/" publishes the API (/selfservice/v1/...), "/ui" only the portal.
route:
  enabled: false
  hostnames: []
  pathPrefix: /selfservice
  rewritePrefix: /
  parentRefs: []

# Restrict which pods may reach the service (the portal backend, the gateway).
# ingressFrom: NetworkPolicy peers, e.g.
#   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gateway}}
# egress: optional NetworkPolicy egress rules; empty leaves egress open (the
# service needs DNS, PostgreSQL, Terrakube, OpenBao and the OIDC issuer).
networkPolicy:
  enabled: false
  ingressFrom: []
  egress: []

resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 256Mi
