image:
  repository: ghcr.io/3sky/terrakube-selfservice
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# --- Catalog: the templates this deployment offers --------------------------
# Structured catalog, validated against catalog.schema.json at install time.
# See examples/catalog.yaml in the repository.
catalog:
  templates: []
# Or use an existing ConfigMap with a catalog.yaml key (catalog is then ignored).
existingCatalogConfigMap: ""

# --- API keys and database -----------------------------------------------------
# Bearer keys accepted from calling portals (several allow rotation).
apiKeys: []
database:
  host: ""
  port: 5432
  name: terrakube_selfservice
  user: terrakube_selfservice
  password: ""
  sslmode: require
# Or an existing Secret with API_KEYS (comma-separated) and DATABASE_URL keys;
# apiKeys and database are then ignored.
existingSecret: ""

# --- Terrakube -----------------------------------------------------------------
terrakube:
  apiUrl: http://terrakube-api-service.terrakube.svc.cluster.local:8080
  # Public UI URL, used for workspace links. Required.
  uiUrl: ""
  # Organization that owns the lab workspaces. Required.
  organization: ""
  # VCS connection id for private template repositories (optional).
  vcsId: ""
  applyTemplate: Plan and apply
  destroyTemplate: Destroy
  # Project for lab workspaces, created if missing; "" = no project.
  project: Self-service
  # Tag workspaces with lab_owner:<email> and expires_at:<UTC time> (moved on
  # extend, removed after destroy) so admins can filter labs in the Terrakube UI.
  tags: true

# --- OpenBao / Vault ------------------------------------------------------
# Kubernetes auth with serviceAccount.name. Used for the access endpoint and,
# unless token.existingSecret or token.value is set, for the Terrakube token.
openbao:
  addr: ""
  role: terrakube-selfservice

# Terrakube personal access token, one of:
token:
  # 1. An existing Secret, mounted as a file and re-read after a 401.
  existingSecret:
    name: ""
    key: token
  # 2. OpenBao kv-v2 (openbao.addr above). addr/role here are accepted as
  #    aliases of openbao.addr/openbao.role for 0.1.x values files.
  openbao:
    addr: ""
    role: ""
    secretPath: secret/data/terrakube-selfservice
    secretKey: terrakube_token
  # 3. A literal value, stored in the chart's Secret (development only).
  value: ""

# --- Users ------------------------------------------------------------------
users:
  # May see and act on every lab and read analytics.
  adminEmails: []
  # Token mode: identify users by their OIDC ID token (X-User-Token) instead of
  # the X-Actor-Email header set by the portal backend. Recommended.
  token:
    issuer: ""
    audience: ""
    # Defaults to the issuer's discovery document.
    jwksUrl: ""
    emailClaim: email

# --- Access details ---------------------------------------------------------
access:
  # kv-v2 path where templates publish each lab's access details; {name} is the lab name.
  secretPath: secret/data/labs/{name}

reconcileIntervalSeconds: 30
deleteWorkspaceAfterDestroy: true

serviceAccount:
  # Bind this name in your OpenBao/Vault Kubernetes auth role.
  name: terrakube-selfservice

# Optional Gateway API route; the prefix is stripped before the service.
route:
  enabled: false
  hostnames: []
  pathPrefix: /selfservice
  parentRefs: []

resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 256Mi
