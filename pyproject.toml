[project]
name = "terrakube-selfservice"
version = "0.7.2"
description = "Self-service environments on Terrakube: templates with forms, TTL policy and usage analytics"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.7.0",
  "uvicorn==0.37.0",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.10",
  "pyyaml==6.0.3",
  "pyjwt[crypto]==2.15.1",
  "authlib==1.8.0",
  "itsdangerous==2.2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["ui_static/*"]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
