<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="%BASE%">
  <title>%TITLE%</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="#/catalog">
      %TITLE%
    </a>
    <nav>
      <a href="#/catalog" data-nav="catalog"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3v10M3 8h10"/></svg>New lab</a>
      <a href="#/labs" data-nav="labs"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>My labs</a>
      <a href="#/reports" data-nav="reports" id="nav-reports" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Reports</a>
    </nav>
    <div class="user"><span id="user-email"></span> · <a href="logout">Sign out</a></div>
  </header>
  <div class="crumbs" id="crumbs"></div>
  <main id="view"><p class="muted">Loading…</p></main>
  <div id="toast" role="status" hidden></div>
  <script src="static/app.js"></script>
</body>
</html>
