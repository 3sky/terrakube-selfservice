name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - run: pytest -q tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
          PYTHONPATH: .:tests
      - uses: azure/setup-helm@v4
      - run: |
          { echo "catalog:"; sed 's/^/  /' examples/catalog.yaml; } > /tmp/catalog-values.yaml
          helm lint charts/terrakube-selfservice -f /tmp/catalog-values.yaml \
            --set terrakube.uiUrl=https://terrakube.example.com,terrakube.organization=example \
            --set token.value=x,apiKeys[0]=x,database.host=db,database.password=x

  # main: image tagged with the commit SHA. vX.Y.Z tags: image X.Y.Z and the
  # Helm chart X.Y.Z (appVersion X.Y.Z) at oci://ghcr.io/<owner>/charts.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/terrakube-selfservice" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.version && format('{0}:{1}', steps.meta.outputs.image, steps.meta.outputs.version) || '' }}
      - if: steps.meta.outputs.version
        uses: azure/setup-helm@v4
      - if: steps.meta.outputs.version
        run: |
          helm package charts/terrakube-selfservice \
            --version "${{ steps.meta.outputs.version }}" --app-version "${{ steps.meta.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push terrakube-selfservice-*.tgz "${{ steps.meta.outputs.charts }}"
