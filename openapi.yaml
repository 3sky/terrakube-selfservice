openapi: 3.1.0
info:
  title: Terrakube Self-Service
  description: 'Self-service environments (**labs**) on Terrakube. A portal lists
    templates, the user fills in a form, and the

    service creates a Terrakube workspace, applies it, hands over its access details,
    and destroys it when its

    lifetime ends.


    **Authentication.** Every `/v1` call carries the portal''s API key (`Authorization:
    Bearer <key>`) and the end

    user: a verified OIDC ID token in `X-User-Token` (token mode) or `X-Actor-Email`
    set by the portal backend from its

    own session (header mode). Call the service from the portal backend only, never
    from a browser.


    **Roles.** `user`: own labs only (another user''s lab answers `404`). `auditor`:
    also reads every lab and the

    analytics, but cannot act on other people''s labs or read their access details
    (`403`). `admin`: everything.


    **Lifecycle.** `pending` → `provisioning` → `ready` or `failed` → `destroying`
    → `destroyed` or `destroy_failed`.

    Poll a lab every 15-30 s while it is `pending` or `provisioning`.


    **Lifetimes.** Labs expire at `expires_at` and are destroyed automatically; `extend`
    adds hours up to the

    template''s `max_ttl_hours` from creation.


    Integration guide: https://github.com/3sky/terrakube-selfservice/blob/main/docs/portal-integration.md'
  version: 0.6.1
paths:
  /v1/templates:
    get:
