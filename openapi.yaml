          minimum: 1
          default: 30
          title: Days
      - name: X-Actor-Email
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Header mode: the signed-in user, set by the portal backend
            from its own session. Ignored in token mode.'
          title: X-Actor-Email
        description: 'Header mode: the signed-in user, set by the portal backend from
          its own session. Ignored in token mode.'
      - name: X-User-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Token mode: the signed-in user''s OIDC ID token, verified
            by the service.'
          title: X-User-Token
        description: 'Token mode: the signed-in user''s OIDC ID token, verified by
          the service.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTimeseries'
        '401':
          description: Missing or invalid API key or user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The user may not do this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    AnalyticsSummary:
      properties:
        window_days:
          type: integer
          title: Window Days
        active_labs:
          type: integer
          title: Active Labs
          description: Labs pending, provisioning, ready or failed (not yet destroyed).
        needs_attention:
          type: integer
          title: Needs Attention
          description: 'Labs in destroy_failed: cleanup needs a person.'
        by_status:
          additionalProperties:
            type: integer
          type: object
          title: By Status
        created:
          type: integer
          title: Created
        destroyed:
          type: integer
          title: Destroyed
        expired:
          type: integer
          title: Expired
        provision_failures:
          type: integer
          title: Provision Failures
        templates:
          items:
            $ref: '#/components/schemas/TemplateStats'
          type: array
          title: Templates
        top_owners:
          items:
            $ref: '#/components/schemas/OwnerStats'
          type: array
          title: Top Owners
      type: object
      required:
      - window_days
      - active_labs
      - needs_attention
      - by_status
      - created
      - destroyed
      - expired
      - provision_failures
      - templates
      - top_owners
      title: AnalyticsSummary
    AnalyticsTimeseries:
      properties:
        window_days:
          type: integer
          title: Window Days
        points:
          items:
            $ref: '#/components/schemas/DailyPoint'
          type: array
          title: Points
      type: object
      required:
      - window_days
      - points
      title: AnalyticsTimeseries
    CostItem:
      properties:
        label:
          type: string
          title: Label
        hourly:
          type: number
          title: Hourly
      type: object
      required:
      - label
      - hourly
      title: CostItem
    CostLine:
      properties:
        template_id:
          type: string
          title: Template Id
        labs:
          type: integer
          title: Labs
        lab_hours:
          type: number
          title: Lab Hours
        estimated_cost:
          type: number
          title: Estimated Cost
      type: object
      required:
      - template_id
      - labs
      - lab_hours
      - estimated_cost
      title: CostLine
    CostReport:
      properties:
        window_days:
          type: integer
          title: Window Days
        currency:
          type: string
          title: Currency
        labs:
          type: integer
          title: Labs
        lab_hours:
          type: number
          title: Lab Hours
        estimated_cost:
          type: number
          title: Estimated Cost
        unpriced_labs:
          type: integer
          title: Unpriced Labs
          description: Labs that ran but have no price (template without a cost model).
        owners:
          items:
            $ref: '#/components/schemas/OwnerCost'
          type: array
          title: Owners
        templates:
          items:
            $ref: '#/components/schemas/CostLine'
          type: array
          title: Templates
        method:
          type: string
          title: Method
      type: object
      required:
      - window_days
      - currency
      - labs
      - lab_hours
      - estimated_cost
      - unpriced_labs
      - owners
      - templates
      - method
      title: CostReport
    DailyPoint:
      properties:
        day:
          type: string
          format: date
          title: Day
        created:
          type: integer
          title: Created
        destroyed:
          type: integer
          title: Destroyed
        expired:
          type: integer
          title: Expired
      type: object
      required:
      - day
      - created
      - destroyed
      - expired
      title: DailyPoint
    DestroyRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      title: DestroyRequest
    Estimate:
      properties:
        currency:
          type: string
          title: Currency
        hourly:
          type: number
          title: Hourly
        ttl_hours:
          type: integer
          title: Ttl Hours
        total:
          type: number
          title: Total
          description: hourly × ttl_hours
        items:
          items:
            $ref: '#/components/schemas/CostItem'
          type: array
          title: Items
      type: object
      required:
      - currency
      - hourly
      - ttl_hours
      - total
      - items
      title: Estimate
    EstimateRequest:
      properties:
        inputs:
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
          type: object
          title: Inputs
          default: {}
        ttl_hours:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Ttl Hours
          description: Defaults to the template's default_ttl_hours.
      additionalProperties: false
      type: object
      title: EstimateRequest
    ExtendRequest:
      properties:
        hours:
          type: integer
          maximum: 720.0
          exclusiveMinimum: 0.0
          title: Hours
          description: Added to the current expiry, capped at max_ttl_hours.
      additionalProperties: false
      type: object
      required:
      - hours
      title: ExtendRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InputType:
      type: string
      enum:
      - string
      - number
      - boolean
      - enum
      title: InputType
    Lab:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        template_id:
          type: string
          title: Template Id
        owner_email:
          type: string
          title: Owner Email
        status:
          $ref: '#/components/schemas/LabStatus'
        status_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Detail
        inputs:
          additionalProperties: true
          type: object
          title: Inputs
        created_at:
          type: string
          format: date-time
          title: Created At
        ready_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ready At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        destroy_requested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Destroy Requested At
        destroyed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Destroyed At
        destroy_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Destroy Reason
        extension_count:
          type: integer
          title: Extension Count
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
        estimated_hourly_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Estimated Hourly Cost
          description: Snapshot taken at creation.
        estimated_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Estimated Cost
          description: 'Cost so far: hourly × hours from creation to destruction (or
            now); 0 if never ready.'
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
        workspace_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Url
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Id
      type: object
      required:
      - id
      - name
      - template_id
      - owner_email
      - status
      - inputs
      - created_at
      - expires_at
      - extension_count
      title: Lab
    LabAccess:
      properties:
        lab_id:
          type: string
          format: uuid
          title: Lab Id
        name:
          type: string
          title: Name
        values:
          additionalProperties:
            type: string
          type: object
          title: Values
      type: object
      required:
      - lab_id
      - name
      - values
      title: LabAccess
      description: Access details the lab template published (kubeconfig, passwords,
        URLs). Show once; never cache.
    LabCreate:
      properties:
        template_id:
          type: string
          title: Template Id
        name:
          anyOf:
          - type: string
            pattern: ^[a-z][a-z0-9-]{2,30}[a-z0-9]$
          - type: 'null'
          title: Name
          description: Lowercase, 4-32 chars; also names the workspace. Omit for a
            random `<owner>-<5 chars>` name.
        owner_email:
          anyOf:
          - type: string
            pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          - type: 'null'
          title: Owner Email
          description: Defaults to the calling user. Only admins may create labs for
            someone else.
        ttl_hours:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Ttl Hours
          description: Defaults to the template's default_ttl_hours.
        inputs:
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
          type: object
          title: Inputs
          default: {}
      additionalProperties: false
      type: object
      required:
      - template_id
      title: LabCreate
      examples:
      - inputs:
          node_pool_instance_count: 2
        template_id: lke-lab
        ttl_hours: 4
    LabEvent:
      properties:
        type:
          type: string
          title: Type
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        at:
          type: string
          format: date-time
          title: At
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - type
      - actor
      - at
      - details
      title: LabEvent
    LabEventList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/LabEvent'
          type: array
          title: Items
      type: object
      required:
      - items
      title: LabEventList
    LabList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Lab'
          type: array
          title: Items
      type: object
      required:
      - items
      title: LabList
    LabStatus:
      type: string
      enum:
      - pending
      - provisioning
      - ready
      - failed
      - destroying
      - destroy_failed
      - destroyed
      title: LabStatus
    OwnerCost:
      properties:
        owner_email:
          type: string
          title: Owner Email
        labs:
          type: integer
          title: Labs
        lab_hours:
          type: number
          title: Lab Hours
        estimated_cost:
          type: number
          title: Estimated Cost
        templates:
          items:
            $ref: '#/components/schemas/CostLine'
          type: array
          title: Templates
      type: object
      required:
      - owner_email
      - labs
      - lab_hours
      - estimated_cost
      - templates
      title: OwnerCost
    OwnerStats:
      properties:
        owner_email:
          type: string
          title: Owner Email
        created:
          type: integer
          title: Created
        active:
          type: integer
          title: Active
      type: object
      required:
      - owner_email
      - created
      - active
      title: OwnerStats
    Problem:
      properties:
        detail:
          anyOf:
          - type: string
          - items: {}
            type: array
          title: Detail
          description: Message, or a list of field errors for 422 validation failures.
      type: object
      required:
      - detail
      title: Problem
    Template:
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        default_ttl_hours:
          type: integer
          exclusiveMinimum: 0.0
          title: Default Ttl Hours
        max_ttl_hours:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Ttl Hours
          description: Maximum lifetime from creation, including extensions.
        inputs:
          items:
            $ref: '#/components/schemas/TemplateInput'
          type: array
          title: Inputs
          default: []
      type: object
      required:
      - id
      - name
      - default_ttl_hours
      - max_ttl_hours
      title: Template
    TemplateInput:
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          title: Name
          description: Terraform variable name.
        label:
          type: string
          title: Label
        type:
          $ref: '#/components/schemas/InputType'
          default: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        required:
          type: boolean
          title: Required
          default: false
        default:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - type: 'null'
          title: Default
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
          description: Allowed values for type enum.
        pattern:
          anyOf:
          - type: string
          - type: 'null'
          title: Pattern
          description: Regular expression for type string.
        minimum:
          anyOf:
          - type: number
          - type: 'null'
          title: Minimum
        maximum:
          anyOf:
          - type: number
          - type: 'null'
          title: Maximum
        sensitive:
          type: boolean
          title: Sensitive
          description: Hidden in API responses and Terrakube UI.
          default: false
      type: object
      required:
      - name
      - label
      title: TemplateInput
      description: One form field. Portals render their form from these.
    TemplateList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Template'
          type: array
          title: Items
      type: object
      required:
      - items
      title: TemplateList
    TemplateStats:
      properties:
        template_id:
          type: string
          title: Template Id
        created:
          type: integer
          title: Created
        active:
          type: integer
          title: Active
        needs_attention:
          type: integer
          title: Needs Attention
          description: Labs whose destroy failed; their resources may still exist.
        destroyed:
          type: integer
          title: Destroyed
        expired:
          type: integer
          title: Expired
        failed:
          type: integer
          title: Failed
        avg_lifetime_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Lifetime Hours
        avg_provision_minutes:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Provision Minutes
      type: object
      required:
      - template_id
      - created
      - active
      - needs_attention
      - destroyed
      - expired
      - failed
      - avg_lifetime_hours
      - avg_provision_minutes
      title: TemplateStats
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: API key issued to the calling portal.
      scheme: bearer
tags:
- name: templates
  description: 'The catalog: templates, their form inputs, and cost estimates.'
- name: labs
  description: Create labs and follow, extend, retry, destroy and access them. Users
    see their own labs, auditors and admins see all; only owners and admins act on
    a lab.
- name: analytics
  description: Usage and estimated cost reports. Auditors and admins.
